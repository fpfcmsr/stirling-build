  # =========================================================================
  # 6. Stirling PDF Desktop Application (Tauri .deb repack)
  # =========================================================================
  - name: stirling-pdf
    buildsystem: simple
    build-commands:
      # Extract the .deb package to a staging directory
      - ar x Stirling-PDF-linux-x86_64.deb
      - mkdir -p _staging
      - tar xf data.tar.* -C _staging
      - |
        # Copy the Tauri binary
        find _staging -name 'stirling-pdf' -type f -executable \
          -exec install -Dm755 {} /app/bin/stirling-pdf \;
        # Copy libraries and resources
        if [ -d _staging/usr/lib ]; then
          cp -a _staging/usr/lib/* /app/lib/ 2>/dev/null || true
        fi
        if [ -d _staging/usr/share/icons ]; then
          cp -a _staging/usr/share/icons/* /app/share/icons/ 2>/dev/null || true
        fi
        # Copy bundled JRE and JAR (Tauri bundles these under resources)
        find _staging -name '*.jar' -exec cp {} /app/lib/ \; 2>/dev/null || true
        find _staging -name 'jre' -type d -exec cp -a {} /app/lib/ \; 2>/dev/null || true

      # Install the wrapper script, desktop file, icon, and AppStream metadata
      - install -Dm755 stirling-pdf-wrapper.sh /app/bin/stirling-pdf-wrapper
      - install -Dm644 com.stirlingpdf.StirlingPDF.desktop /app/share/applications/com.stirlingpdf.StirlingPDF.desktop
      - install -Dm644 com.stirlingpdf.StirlingPDF.metainfo.xml /app/share/metainfo/com.stirlingpdf.StirlingPDF.metainfo.xml
      - install -Dm644 com.stirlingpdf.StirlingPDF.svg /app/share/icons/hicolor/scalable/apps/com.stirlingpdf.StirlingPDF.svg

    sources:
      - type: file
        url: https://github.com/Stirling-Tools/Stirling-PDF/releases/download/v2.7.3/Stirling-PDF-linux-x86_64.deb
        sha256: 4fe3bf2361ecaf3973ff9a5add79777c8900e806bd88c92a3cd118b44ffdaa96
        dest-filename: Stirling-PDF-linux-x86_64.deb

      - type: file
        path: stirling-pdf-wrapper.sh

      - type: file
        path: com.stirlingpdf.StirlingPDF.desktop

      - type: file
        path: com.stirlingpdf.StirlingPDF.metainfo.xml

      - type: file
        path: com.stirlingpdf.StirlingPDF.svg
