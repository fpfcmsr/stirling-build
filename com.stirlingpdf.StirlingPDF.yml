# Flatpak manifest for Stirling PDF Desktop Application
# https://github.com/Stirling-Tools/Stirling-PDF
#
# The desktop app is a Tauri 2.x application (Rust shell + WebKitGTK)
# that spawns a bundled Java backend (JLink minimal JRE + Spring Boot JAR).
#
# For full-feature support (OCR, document conversion, etc.) we also bundle:
#   - LibreOffice (writer, calc, impress) for format conversions
#   - Tesseract OCR with English language data
#   - jbig2enc for JBIG2 compression in OCR pipelines
#   - Python 3 + opencv-python-headless, unoserver, WeasyPrint, pngquant
#
# To update: bump the version/tag in the stirling-pdf source, and update
# the sha256 for the .deb asset on the GitHub release page.

app-id: com.stirlingpdf.StirlingPDF
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21

command: stirling-pdf-wrapper

finish-args:
  # Display access (Wayland + X11 fallback)
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  # GPU acceleration for WebKitGTK rendering
  - --device=dri
  # Network access for optional server connection and updates
  - --share=network
  # Filesystem access for opening/saving PDFs
  - --filesystem=home
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=/tmp
  # D-Bus access for desktop integration
  - --socket=session-bus
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  # System tray / status notifier
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.la'
  - '*.a'

modules:
  # =========================================================================
  # 1. OpenJDK 21 (JRE for the Spring Boot backend)
  # =========================================================================
  - name: openjdk21
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  # =========================================================================
  # 2. Tesseract OCR + English language data
  # =========================================================================
  - name: leptonica
    buildsystem: autotools
    post-install:
      # jbig2enc checks for -llept (old name); create compat symlinks
      - ln -sf libleptonica.so /app/lib/liblept.so
      - ln -sf libleptonica.so.6 /app/lib/liblept.so.6
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.84.1/leptonica-1.84.1.tar.gz
        sha256: 2b3e1254b1cca381e77c819b59ca99774ff43530209b9aeb511e1d46588a64f6
    cleanup:
      - /bin

  - name: tesseract
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.0.tar.gz
        sha256: f2fb34ca035b6d087a42875a35a7a5c4155fa9979c6132365b1e5a28ebc3fc11

  - name: tesseract-lang-eng
    buildsystem: simple
    build-commands:
      - install -Dm644 eng.traineddata /app/share/tessdata/eng.traineddata
    sources:
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_best/raw/main/eng.traineddata
        sha256: 8280aed0782fe27257a68ea10fe7ef324ca0f8d85bd2fd145d1c2b560bcb66ba
        dest-filename: eng.traineddata

  # =========================================================================
  # 3. jbig2enc (JBIG2 compression for OCR)
  # =========================================================================
  - name: jbig2enc
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/agl/jbig2enc.git
        commit: b5a62d0504a62e454e4ddcf34cfee77b9c4f2be6

  # =========================================================================
  # 4. LibreOffice (for document conversion: docx->pdf, xlsx->pdf, etc.)
  # =========================================================================
  - name: libreoffice
    buildsystem: simple
    build-commands:
      - bash install-libreoffice.sh LibreOffice_25.8.6_Linux_x86-64_deb.tar.gz /app
    sources:
      - type: file
        url: https://download.documentfoundation.org/libreoffice/stable/25.8.6/deb/x86_64/LibreOffice_25.8.6_Linux_x86-64_deb.tar.gz
        sha256: 90b083e6c8f860630ea2ac8558a2bed2756a4393c3f727aa7bd13b0bce85e8a9
      - type: file
        path: install-libreoffice.sh

  # =========================================================================
  # 5. Python dependencies (unoserver, opencv, WeasyPrint, pngquant)
  # =========================================================================
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links=. --prefix=/app --no-build-isolation
          opencv-python-headless unoserver pngquant-cli WeasyPrint
